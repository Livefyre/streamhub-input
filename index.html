<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="dev/css/hub-input.css">
    <style>
    #wall {
        /*width:500px;*/
    }

    #comment-editor {
        width:500px;
        position: absolute;
        top: 12px;
        right: 12px;
    }

    legend {
        text-decoration: underline;
        text-transform: uppercase;
    }

    label {
        font-style: italic;
        text-transform: capitalize;
        padding-left: 2em;
    }

    label:after {
        content: ":";
    }

    button {
        margin-right: 2em;
    }

    </style>
    <script type="text/javascript" src="//platform.twitter.com/widgets.js"></script>

</head>
    <body class="lf">
        <legend>authentication</legend>
        <button id="auth-button" class="auth-button">Log in</button>
        <legend>collection</legend>
        <label>network</label>
        <input type="text" id="network" value="livefyre.com" />
        <br>
        <label>environment</label>
        <input type="text" id="environment" value="qa-ext.livefyre.com" />
        <br>
        <label>site ID</label>
        <input type="text" id="siteId" value="290596" />
        <br>
        <label>article ID</label>
        <input type="text" id="articleId" value="136" />

        <section id="upper-controls">
            <button id="top-upload">Post Your Photo <i class="fycon-composer-photo"></i></button>
            <button id="top-comment">Post Your Comment</button>
        </section>

        <div id="wall"></div>

        <section id="lower-controls">
            <button id="btm-upload">Post Your Photo <i class="fycon-composer-photo"></i></button>
            <button id="btm-comment">Post Your Comment</button>
        </section>

        <div id="comment-editor"></div>

        <script src="lib/cajon/cajon.js" type="text/javascript"></script>
        <script src="requirejs.conf.js" type="text/javascript"></script>
        <script>
        require([
            'streamhub-wall',
            'streamhub-sdk/collection',
            'auth',
            'livefyre-auth',
            'streamhub-input/upload',
            'streamhub-input/upload/button',
            'streamhub-input/content-editor',
            'streamhub-input/content-editor/button',
            'auth/contrib/auth-button'
        ],function (Wall, Collection, auth, livefyreAuth, Upload, UploadButton, ContentEditor, CommentButton, createAuthButton) {
            var opts,
                view,
                collection,
                archive,
                inputs,
                embUp,
                embCom,
                topUp,
                topCom,
                btmUp,
                btmCom,
                $form;

            livefyreAuth.plugin(auth);
            auth.delegate(livefyreAuth.createDelegate('http://qa-ext.livefyre.com'));

            wall = new Wall({
                initial: 5,
                showMore: 4,
                el: document.getElementById("wall")
            });

            embCom = new ContentEditor({
                el: document.getElementById("comment-editor"),
                mediaEnabled: true
            });
            embCom.render();

            topUp = new UploadButton({
                el: document.getElementById("top-upload")
            });

            topCom = new CommentButton({
                el: document.getElementById("top-comment")
            });

            btmUp = new UploadButton({
                el: document.getElementById("btm-upload")
            });

            btmCom = new CommentButton({
                el: document.getElementById("btm-comment")
            });

            inputs = [embCom, topUp, topCom, btmUp, btmCom];


            $(function () {
                createAuthButton(auth, document.getElementById('auth-button'));
                // $('.auth-login').click(function () {
                //     authDelegate.login();
                // });
                // var url = window.location.href;
                // var query = url.split('?')[1];
                // if (!query) {
                //     return $;
                // }

                // var pairs = query.split('&');
                // opts = {};
                // pairs.forEach(function(s) {
                //     var pair = s.split('=');
                //     opts[pair[0]] = pair[1];
                //     $('#' + pair[0]).val(pair[1]);
                // });

                onPageLoad();
            });

            function onPageLoad() {
                var token = $('#lftoken').val(),
                    network = $('#network').val(),
                    environment = $('#environment').val(),
                    site = $('#siteId').val(),
                    article = $('#articleId').val();

                token && Auth.setToken(token);

                if (!network || !environment || !site || !article) {
                    return;
                }

                opts = {
                    network: network,
                    environment: environment,
                    siteId: site,
                    articleId: article
                }

                if (collection) {
                    destroy();
                }

                build(opts);
            }

            function build(opts) {
                collection = new Collection(opts);
                collection.pipe(wall);
                archive = collection.createArchive();
                archive.pipe(wall.more);

                // embCom.setDestination(collection);
                inputs.forEach(function (o) {
                    o && o.pipe(collection);
                });
            }

            function destroy() {
                inputs.forEach(function (o) {
                    o && o.unpipe(collection);
                });

                collection.unpipe(wall);
                archive.unpipe(wall);
                //TODO (joao) Destroy collection?
                archive = collection = null;
            }

        });
        </script>
    </body>
</html>
