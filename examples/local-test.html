<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="/dev/css/hub-input.css">
    <style>
    #comment-editor {
        width:500px;
        position: absolute;
        top: 12px;
        right: 12px;
    }

    legend {
        text-decoration: underline;
        text-transform: uppercase;
    }

    label {
        font-style: italic;
        text-transform: capitalize;
        padding-left: 2em;
    }

    label:after {
        content: ":";
    }

    button {
        margin-right: 2em;
    }

    </style>
    <script type="text/javascript" src="//platform.twitter.com/widgets.js"></script>
</head>
    <body class="lf">
        <form>
            <legend>authentication</legend>
            <label>token</label>
            <button class="auth-login">Log in</button>
            <input type="text" id="lftoken" value="" />
        </form>

        <section id="upper-controls">
            <button id="top-upload">Post Your Photo <i class="fycon-composer-photo"></i></button>
            <button id="top-comment">Post Your Comment</button>
        </section>

        <div id="view"></div>

        <div id="comment-editor"></div>

        <script src="/lib/cajon/cajon.js" type="text/javascript"></script>
        <script src="/requirejs.conf.js" type="text/javascript"></script>
        <script>
        require([
            // 'streamhub-sdk/content/views/content-list-view',
            'streamhub-wall',
            'streamhub-sdk/collection',
            'auth',
            'streamhub-input/upload',
            'streamhub-input/upload/button',
            'streamhub-input/content-editor',
            'streamhub-input/content-editor/button',
            'auth-delegates/delegates/livefyre'
        ],function (View, Collection, Auth, Upload, UploadButton, CommentView, CommentButton, LivefyreAuthDelegate) {
            var opts,
                view,
                collection,
                archive,
                inputs,
                embUp,
                embCom,
                topUp,
                topCom,
                btmUp,
                btmCom,
                $form;

            view = new View({
                initial: 5,
                showMore: 4,
                el: document.getElementById("view")
            });

            embCom = new CommentView({
                el: document.getElementById("comment-editor"),
                mediaEnabled: true
            });
            embCom.render();

            topCom = new CommentButton({
                el: document.getElementById("top-comment")
            });

            btmCom = new CommentButton({
                el: document.getElementById("btm-comment")
            });

            inputs = [embCom, topUp, topCom, btmUp, btmCom];

            $(function () {
                $('.auth-login').click(function () {
                    authDelegate.login();
                });
                var url = window.location.href;
                var query = url.split('?')[1];
                if (!query) {
                    return $;
                }

                var pairs = query.split('&');
                opts = {};
                pairs.forEach(function(s) {
                    var pair = s.split('=');
                    opts[pair[0]] = pair[1];
                    $('#' + pair[0]).val(pair[1]);
                });

            });

            $('#refresh').click(function () {
                submit();
                !opts && (opts = {});
                opts.lftoken = Auth.getToken();
                var subStr = $.param(opts);
                var loc = window.location.href.split('?')[0];
                loc += '?' + subStr;
                window.location.href = loc;
            });

            $form = $('form');


            var ARTICLE_RE = /[?&]articleId=([^&#]*)/;
            var SITE_RE = /[?&]siteId=([^&#]*)/;

            try {
                var LF_articleId = document.location.href.match(ARTICLE_RE)[1];
            } catch (e) {
                document.write('<h1>USE ?articleId=XXX QUERY PARAM!</h1>');
            }

            collection = new Collection({
                network: 'fyre',
                articleId: 'input-' + LF_articleId,
                siteId: '286470'
            });
            collection.pipe(view);
            archive = collection.createArchive();
            archive.pipe(view.more);


            var authDelegate = new LivefyreAuthDelegate(collection.articleId, collection.siteId, 'http://www.fyre');
            var authUser = authDelegate.getUser();
            authUser.on('login', function () {
                debugger;
                var $tokenInput = $('#lftoken');
                var token = authUser.get('token');
                $tokenInput.val(token);
                collection.setToken(token);  // Where should this happen?
            });

            inputs.forEach(function (o) {
                o && o.pipe(collection);
            });

            function destroy() {
                inputs.forEach(function (o) {
                    o && o.unpipe(collection);
                });

                collection.unpipe(view);
                archive.unpipe(view);
                archive = collection = null;
            }

        });
        </script>
    </body>
</html>
